# =============================================================================
# .github/workflows/kapilar.yml — her PR'da kapı koşusu (scripts/gates.sh'in CI eşi)
# =============================================================================
# Yerelde kapılar Docker'da `bash scripts/gates.sh` ile koşar (CLAUDE.md §4).
# Bu iş akışı aynı adımları her PR'da ve main'e her push'ta koşar; böylece
# paketleme yollarına dokunmayan bir değişiklik de (ör. yalnız backend ya da
# arayüz) birleşmeden önce sınanmış olur. Adım sırası ve bayraklar gates.sh
# ile BİREBİR tutulur — biri değişirse öteki de değişmeli.
# =============================================================================
name: Kapılar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kapilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + masaüstü (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    env:
      # Tarih disiplini testleri yerel saate bağlı (CLAUDE.md §7.1).
      TZ: Europe/Istanbul
      # Backend `desktop` paketini import eder (app_password → desktop.backup).
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: WeasyPrint sistem kütüphaneleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 \
            libfontconfig1 libglib2.0-0 fonts-dejavu-core
      - name: Bağımlılıklar
        run: pip install -r backend/requirements-dev.txt
      - name: pytest (backend, kapsam ≥ %75)
        working-directory: backend
        run: pytest
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        working-directory: backend
        run: mypy .
      # AYRI süreç: desktop testleri günlük yapılandırmasını değiştirir (gates.sh notu).
      - name: pytest (desktop + packaging)
        run: pytest desktop/tests packaging/tests -q --no-cov
      - name: ruff (desktop + packaging)
        run: |
          ruff check desktop packaging --config backend/pyproject.toml
          ruff format --check desktop packaging --config backend/pyproject.toml
      - name: mypy (desktop + packaging)
        env:
          MYPYPATH: ${{ github.workspace }}/backend
        run: |
          mypy desktop --config-file backend/pyproject.toml
          mypy packaging --config-file backend/pyproject.toml

  arayuz:
    name: Arayüz (tsc, eslint, prettier, vitest)
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # docker-compose.yml geliştirme imajıyla aynı ana sürüm.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: eslint
        run: npx eslint src
      - name: prettier --check
        run: npx prettier --check src
      - name: vitest
        run: npm test -- --run
