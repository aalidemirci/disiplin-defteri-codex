name: Web sitesini yayımla (okulapp.org yönlendirmesi)

# Site okulapp.org'a taşındı; burada yalnız eski bağlantıları kırılmasın diye
# okulapp.org'a yönlendiren stub sayfalar yayımlanır.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
      - name: GitHub Pages'i yapılandır
        uses: actions/configure-pages@v5
      - name: Site paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: GitHub Pages'e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
