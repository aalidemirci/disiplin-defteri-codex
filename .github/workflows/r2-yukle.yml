# =============================================================================
# .github/workflows/r2-yukle.yml — var olan Release'i indir.okulapp.org'a yükle
# =============================================================================
# paketleme.yml yayın sırasında R2'ye kendisi yükler; bu iş yalnız o adım
# atlandığında/kırıldığında (ör. Cloudflare secret'ları Release'ten sonra
# eklendiyse) paketleri yeniden üretmeden Release'teki dosyaları yükler.
# =============================================================================
name: R2'ye yükle

on:
  workflow_dispatch:
    inputs:
      etiket:
        description: "Yüklenecek Release etiketi (ör. v2026.9.0-beta.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  yukle:
    name: Release dosyalarını R2'ye yükle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/r2-yukle.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Release dosyalarını indir
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ inputs.etiket }}
        run: gh release download "${ETIKET}" --repo "${GITHUB_REPOSITORY}" --dir yayin
      - name: İndirme alanına yükle (R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ETIKET: ${{ inputs.etiket }}
        run: bash packaging/r2-yukle.sh yayin "${ETIKET#v}"
